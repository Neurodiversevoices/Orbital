<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Projects Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      background: #01020A;
      color: #E5E7EB;
      padding: 20px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #2DD4BF;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2DD4BF;
      color: #01020A;
    }

    .btn-primary:hover {
      background: #14B8A6;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #E5E7EB;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-success {
      background: #10B981;
      color: white;
    }

    .btn-danger {
      background: #EF4444;
      color: white;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 14px;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .card h3 {
      font-size: 16px;
      color: #E5E7EB;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-item {
      padding: 12px;
      border-radius: 8px;
      background: rgba(45, 212, 191, 0.1);
      border: 1px solid rgba(45, 212, 191, 0.3);
      cursor: pointer;
      transition: all 0.2s;
    }

    .project-item:hover {
      background: rgba(45, 212, 191, 0.15);
    }

    .project-item.active {
      background: rgba(45, 212, 191, 0.2);
      border-color: rgba(45, 212, 191, 0.5);
    }

    .project-name {
      font-weight: 500;
      color: #2DD4BF;
      font-size: 14px;
    }

    .project-meta {
      font-size: 12px;
      color: #9CA3AF;
      margin-top: 4px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      font-size: 13px;
      color: #9CA3AF;
    }

    .stat-value {
      font-size: 16px;
      color: #E5E7EB;
      font-weight: 500;
    }

    .content {
      flex: 1;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab {
      padding: 12px 16px;
      border: none;
      background: none;
      color: #9CA3AF;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: #E5E7EB;
    }

    .tab.active {
      color: #2DD4BF;
      border-bottom-color: #2DD4BF;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .post-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .post-platform {
      font-size: 12px;
      font-weight: 600;
      color: #2DD4BF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .post-time {
      font-size: 12px;
      color: #9CA3AF;
    }

    .post-copy {
      font-size: 13px;
      line-height: 1.5;
      color: #E5E7EB;
      margin-bottom: 12px;
      flex: 1;
    }

    .post-meta {
      font-size: 12px;
      color: #9CA3AF;
      margin-bottom: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .post-actions {
      display: flex;
      gap: 8px;
    }

    .post-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 12px;
    }

    .occ-section {
      margin-bottom: 30px;
    }

    .execution-panel {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: flex-end;
    }

    .execution-panel input {
      flex: 1;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #E5E7EB;
      font-size: 14px;
    }

    .departments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .department-status {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .dept-name {
      font-size: 12px;
      font-weight: 600;
      color: #2DD4BF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .dept-status {
      font-size: 13px;
      color: #E5E7EB;
      padding: 4px 8px;
      background: rgba(45, 212, 191, 0.1);
      border-radius: 4px;
      display: inline-block;
    }

    .dept-status.working {
      background: rgba(59, 130, 246, 0.1);
      color: #60A5FA;
    }

    .dept-status.done {
      background: rgba(16, 185, 129, 0.1);
      color: #10B981;
    }

    .execution-output {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 16px;
      font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
      font-size: 12px;
      color: #9CA3AF;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-draft {
      background: rgba(107, 114, 128, 0.2);
      color: #D1D5DB;
    }

    .status-approved {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
    }

    .status-posted {
      background: rgba(59, 130, 246, 0.2);
      color: #60A5FA;
    }

    @media (max-width: 1200px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .posts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Orbital Projects Dashboard</h1>
      <div class="header-actions">
        <button class="btn-secondary" onclick="loadProjects()">Refresh</button>
        <button class="btn-primary" onclick="showCreateProjectModal()">+ New Project</button>
      </div>
    </header>

    <div class="main-grid">
      <!-- Sidebar -->
      <div class="sidebar">
        <!-- Projects List -->
        <div class="card">
          <h2>Projects</h2>
          <div class="project-list" id="projectsList"></div>
        </div>

        <!-- Budget Info -->
        <div class="card">
          <h2>Budget Status</h2>
          <div class="stat-row">
            <span class="stat-label">Daily Cap</span>
            <span class="stat-value" id="dailyCap">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Spent Today</span>
            <span class="stat-value" id="spentToday">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Remaining</span>
            <span class="stat-value" id="remaining">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Monthly Burn</span>
            <span class="stat-value" id="monthlyBurn">-</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Runway</span>
            <span class="stat-value" id="runway">-</span>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="content">
        <div class="tabs">
          <button class="tab active" onclick="switchTab(event, 'content')">Tomorrow's Content</button>
          <button class="tab" onclick="switchTab(event, 'occ')">OCC Execution</button>
          <button class="tab" onclick="switchTab(event, 'work')">Team Work</button>
        </div>

        <!-- Content Tab -->
        <div id="content" class="tab-content active">
          <div class="card">
            <h2>Draft Posts for Review</h2>
            <div id="draftPostsContainer" style="margin-top: 16px;">
              <p style="color: #9CA3AF; font-size: 13px;">Loading posts...</p>
            </div>
          </div>
        </div>

        <!-- OCC Tab -->
        <div id="occ" class="tab-content">
          <div class="card occ-section">
            <h2>Run OCC Cycle</h2>
            <div class="execution-panel">
              <input type="text" id="occCommand" placeholder="Enter command (e.g., 'Plan content for Orbital')" value="Plan content for Orbital">
              <button class="btn-primary" onclick="executeOCC()">Execute</button>
            </div>

            <div class="departments-grid" id="departmentsGrid"></div>

            <h3 style="margin-bottom: 12px;">Execution Output</h3>
            <div class="execution-output" id="executionOutput">Ready to execute...</div>
          </div>
        </div>

        <!-- Work Tab -->
        <div id="work" class="tab-content">
          <div class="card">
            <h2>Team Work Items</h2>
            <div id="workItemsContainer" style="margin-top: 16px;">
              <p style="color: #9CA3AF; font-size: 13px;">No work items yet. Run OCC to generate team tasks.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentProjectId = "orbital";
    let occStatus = {};
    let occHistory = [];

    async function loadProjects() {
      try {
        const res = await fetch("/api/projects");
        const data = await res.json();

        const projectsList = document.getElementById("projectsList");
        projectsList.innerHTML = data.projects
          .map(
            (p) => `
          <div class="project-item ${p.project_id === currentProjectId ? "active" : ""}" onclick="selectProject('${p.project_id}')">
            <div class="project-name">${p.name}</div>
            <div class="project-meta">${p.posts_queue_count} posts • ${p.work_items_count} tasks</div>
          </div>
        `
          )
          .join("");

        loadProjectDetails();
        loadBudgetInfo();
        loadDraftPosts();
      } catch (error) {
        console.error("Failed to load projects:", error);
      }
    }

    async function selectProject(projectId) {
      currentProjectId = projectId;
      loadProjects();
    }

    async function loadProjectDetails() {
      try {
        const res = await fetch(`/api/projects-${currentProjectId}`);
        const data = await res.json();
        console.log("Project details:", data.project);
      } catch (error) {
        console.error("Failed to load project details:", error);
      }
    }

    async function loadBudgetInfo() {
      // Simulate budget data
      document.getElementById("dailyCap").textContent = "$139";
      document.getElementById("spentToday").textContent = "$0";
      document.getElementById("remaining").textContent = "$139";
      document.getElementById("monthlyBurn").textContent = "$4,630";
      document.getElementById("runway").textContent = "10.8mo";
    }

    async function loadDraftPosts() {
      try {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split("T")[0];

        const res = await fetch(`/api/projects-posts?projectId=${currentProjectId}&date=${tomorrowStr}`);
        const data = await res.json();

        const container = document.getElementById("draftPostsContainer");
        if (!data.draft_posts || data.draft_posts.length === 0) {
          container.innerHTML = '<p style="color: #9CA3AF; font-size: 13px;">No draft posts scheduled for tomorrow.</p>';
          return;
        }

        const dayName = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][tomorrow.getDay()];

        container.innerHTML = `
          <p style="color: #9CA3AF; font-size: 12px; margin-bottom: 16px;">
            📅 ${dayName}, ${tomorrowStr} — ${data.draft_posts.length} posts ready for review
          </p>
          <div class="posts-grid">
            ${data.draft_posts
              .map(
                (post) => `
              <div class="post-card">
                <div class="post-header">
                  <span class="post-platform">${post.platform}</span>
                  <span class="post-time">${post.scheduled_time}</span>
                </div>
                <div class="post-copy">"${post.copy.substring(0, 80)}..."</div>
                <div class="post-meta">
                  CTA: ${post.cta} <br>
                  ${post.hashtags.length} hashtags
                </div>
                <div class="post-actions">
                  <button class="btn-success" onclick="approvePost('${post.post_id}')">✓ Approve</button>
                  <button class="btn-danger" onclick="rejectPost('${post.post_id}')">✕ Reject</button>
                </div>
              </div>
            `
              )
              .join("")}
          </div>
        `;
      } catch (error) {
        console.error("Failed to load draft posts:", error);
        document.getElementById("draftPostsContainer").innerHTML = `<p style="color: #EF4444;">Error loading posts: ${error.message}</p>`;
      }
    }

    async function approvePost(postId) {
      try {
        const res = await fetch(`/api/projects-posts?projectId=${currentProjectId}&action=approve`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ postId }),
        });

        if (res.ok) {
          alert("✓ Post approved!");
          loadDraftPosts();
        } else {
          alert("Failed to approve post");
        }
      } catch (error) {
        console.error("Failed to approve post:", error);
      }
    }

    async function rejectPost(postId) {
      const reason = prompt("Reason for rejection:");
      if (reason === null) return;

      try {
        const res = await fetch(`/api/projects-posts?projectId=${currentProjectId}&action=reject`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ postId, reason }),
        });

        if (res.ok) {
          alert("✗ Post rejected");
          loadDraftPosts();
        } else {
          alert("Failed to reject post");
        }
      } catch (error) {
        console.error("Failed to reject post:", error);
      }
    }

    async function executeOCC() {
      const command = document.getElementById("occCommand").value || "Plan content for Orbital";
      const output = document.getElementById("executionOutput");

      output.textContent = "Initializing OCC cycle...\n\nDepartments executing:";

      try {
        // Start execution
        const startRes = await fetch("/api/occ-execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command, projectId: currentProjectId }),
        });

        if (!startRes.ok) throw new Error("Failed to start OCC");

        // Poll status
        let allDone = false;
        let iterations = 0;

        while (!allDone && iterations < 20) {
          await new Promise((r) => setTimeout(r, 500));
          iterations++;

          const statusRes = await fetch("/api/occ-status");
          const statusData = await statusRes.json();

          // Build status display
          let statusText = `Initializing OCC cycle for: "${command}"\n\nDepartment Status:\n`;
          const deps = ["RESEARCH", "PRODUCT", "OPERATIONS", "FINANCE", "MARKETING", "SALES"];
          allDone = true;

          deps.forEach((dept) => {
            const status = statusData.status[dept];
            if (status.status !== "done") allDone = false;
            const icon = status.status === "idle" ? "⊙" : status.status === "working" ? "◆" : "✓";
            statusText += `${icon} ${dept}: ${status.status.toUpperCase()} (${status.progress}%)\n`;
          });

          // Add latest outputs
          if (statusData.latest_execution) {
            const latest = statusData.latest_execution;
            statusText += `\nLatest: ${latest.department}\n`;
            statusText += JSON.stringify(latest.output, null, 2).substring(0, 500);
          }

          output.textContent = statusText;

          // Update department grid
          updateDepartmentGrid(statusData.status);
        }

        // Reload posts after OCC completes
        await new Promise((r) => setTimeout(r, 1000));
        loadDraftPosts();
      } catch (error) {
        output.textContent = `ERROR: ${error.message}`;
      }
    }

    function updateDepartmentGrid(status) {
      const deps = ["RESEARCH", "PRODUCT", "OPERATIONS", "FINANCE", "MARKETING", "SALES"];
      const grid = document.getElementById("departmentsGrid");

      grid.innerHTML = deps
        .map((dept) => {
          const s = status[dept];
          return `
        <div class="department-status">
          <div class="dept-name">${dept}</div>
          <div class="dept-status ${s.status}">${s.status === "done" ? "✓ Done" : s.status === "working" ? "⟳ Working" : "Idle"}</div>
        </div>
      `;
        })
        .join("");
    }

    function switchTab(event, tabName) {
      event.preventDefault();

      // Hide all tabs
      document.querySelectorAll(".tab-content").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".tab").forEach((el) => el.classList.remove("active"));

      // Show selected tab
      document.getElementById(tabName).classList.add("active");
      event.target.classList.add("active");
    }

    function showCreateProjectModal() {
      const name = prompt("Project name:");
      if (!name) return;

      const description = prompt("Description:");

      fetch("/api/projects", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, description }),
      })
        .then(() => {
          alert("✓ Project created!");
          loadProjects();
        })
        .catch((error) => alert(`Error: ${error.message}`));
    }

    // Initialize on load
    loadProjects();
    updateDepartmentGrid({});
  </script>
</body>
</html>
