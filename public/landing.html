  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --void: #01020A;
      --cyan: #06B6D4;
      --cyan-glow: rgba(6, 182, 212, 0.55);
      --amber: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.55);
      --crimson: #DC2626;
      --crimson-glow: rgba(220, 38, 38, 0.55);
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #F4F4F5;
      --muted: rgba(255, 255, 255, 0.52);
      --sans: 'DM Sans', system-ui, sans-serif;
      --mono: 'Space Mono', ui-monospace, monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Cinematic vignette + subtle noise */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% 20%, rgba(6, 182, 212, 0.07), transparent 55%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(220, 38, 38, 0.05), transparent 50%),
        radial-gradient(ellipse 50% 40% at 10% 70%, rgba(245, 158, 11, 0.04), transparent 45%),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(1, 2, 10, 0.92) 0%, rgba(1, 2, 10, 0) 100%);
    }

    .nav-logo {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .nav-cta {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text);
      text-decoration: none;
      padding: 10px 22px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .nav-cta:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 24px var(--cyan-glow);
    }

    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.75rem 4rem;
      text-align: center;
    }

    /* Glass orb — continuous spectral cycle cyan → amber → crimson */
    #orb-canvas {
      width: min(88vw, 340px);
      height: min(88vw, 340px);
      margin: 0 auto 2.5rem;
      position: relative;
      border-radius: 50%;
      isolation: isolate;
    }

    #orb-canvas::before {
      content: '';
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background: conic-gradient(
        from var(--spin, 0deg),
        var(--cyan),
        var(--amber),
        var(--crimson),
        var(--cyan)
      );
      opacity: 0.35;
      filter: blur(28px);
      animation: spinGlow 14s linear infinite;
      z-index: -1;
    }

    @keyframes spinGlow {
      to { transform: rotate(360deg); }
    }

    .orb-glass {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 70% 72%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.02) 45%, rgba(0, 0, 0, 0.25) 100%);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 24px 80px rgba(0, 0, 0, 0.55);
      animation: orbSpectrum 12s ease-in-out infinite;
    }

    @keyframes orbSpectrum {
      0%, 100% {
        border-color: rgba(6, 182, 212, 0.45);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 0 60px var(--cyan-glow),
          0 0 120px rgba(6, 182, 212, 0.15);
      }
      33% {
        border-color: rgba(245, 158, 11, 0.5);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 0 60px var(--amber-glow),
          0 0 120px rgba(245, 158, 11, 0.12);
      }
      66% {
        border-color: rgba(220, 38, 38, 0.48);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 0 60px var(--crimson-glow),
          0 0 120px rgba(220, 38, 38, 0.12);
      }
    }

    .orb-core {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.15), transparent 55%);
      animation: corePulse 12s ease-in-out infinite;
    }

    @keyframes corePulse {
      0%, 100% { opacity: 0.9; }
      33% { opacity: 0.75; }
      66% { opacity: 0.85; }
    }

    .orb-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: clamp(9px, 2.4vw, 11px);
      letter-spacing: 0.28em;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 0 40px rgba(6, 182, 212, 0.4);
      animation: labelTint 12s ease-in-out infinite;
    }

    @keyframes labelTint {
      0%, 100% { color: #CFFAFE; text-shadow: 0 0 36px var(--cyan-glow); }
      33% { color: #FEF3C7; text-shadow: 0 0 36px var(--amber-glow); }
      66% { color: #FECACA; text-shadow: 0 0 36px var(--crimson-glow); }
    }

    /* 72px headline — scales down on narrow viewports */
    .hero h1 {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      max-width: 14ch;
      margin: 0 auto 1.25rem;
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.76) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 900px) {
      .hero h1 { font-size: clamp(40px, 10vw, 56px); }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: clamp(32px, 9vw, 44px); }
    }

    .hero .sub {
      font-size: 1.125rem;
      color: var(--muted);
      max-width: 36rem;
      margin: 0 auto 2rem;
      line-height: 1.55;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 2.25rem;
      border-radius: 14px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      color: var(--void);
      background: linear-gradient(135deg, #2DD4BF 0%, #06B6D4 100%);
      border: 1px solid rgba(45, 212, 191, 0.6);
      box-shadow: 0 0 32px rgba(6, 182, 212, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 48px rgba(6, 182, 212, 0.5);
    }

    .cta-ghost {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(10px);
    }

    .cta-ghost:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.28); }

    .film-bar {
      position: fixed;
      left: 0;
      right: 0;
      height: 12vh;
      min-height: 48px;
      max-height: 100px;
      background: #000;
      z-index: 50;
      pointer-events: none;
    }
    .film-bar.top { top: 0; }
    .film-bar.bottom { bottom: 0; }

    footer {
      position: relative;
      z-index: 1;
      padding: 3rem 1.5rem;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer-logo {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--cyan);
      margin-bottom: 1rem;
    }

    .footer-link {
      color: var(--muted);
      text-decoration: none;
      margin: 0 1rem;
      font-size: 0.9rem;
    }
    .footer-link:hover { color: var(--text); }

    .footer-copy {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
